<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660">
  <rect width="1000" height="660" fill="#f7fafc"/>
  <!-- power path: supply -> rectifier -> DC link -> inverter -> motor -->
  <g fill="none" stroke="#258ab9" stroke-width="8" stroke-linecap="round">
    <path d="M190 260H250M400 260H460M610 260H670"/>
    <path d="M820 245H852M820 260H852M820 275H852"/>
    <path d="M905 310L920 470"/>
  </g>
  <!-- blocks -->
  <g fill="#ffffff" stroke="#7a96a4" stroke-width="4">
    <rect x="40" y="200" width="150" height="120" rx="14"/>
    <rect x="250" y="200" width="150" height="120" rx="14"/>
    <rect x="460" y="200" width="150" height="120" rx="14"/>
    <rect x="670" y="200" width="150" height="120" rx="14"/>
    <circle cx="905" cy="260" r="52"/>
    <rect x="460" y="470" width="150" height="70" rx="12" stroke-dasharray="10 6"/>
  </g>
  <!-- supply: three phases -->
  <g stroke="#496471" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M70 235q12-22 25 0t25 0t25 0M70 260q12-22 25 0t25 0t25 0M70 285q12-22 25 0t25 0t25 0"/>
  </g>
  <!-- rectifier: diode bridge -->
  <g stroke="#496471" stroke-width="5" fill="none" stroke-linejoin="round">
    <path d="M325 222l38 38l-38 38l-38-38z"/>
    <path d="M310 252l30 0M325 240l15 12h-30z" fill="#496471"/>
  </g>
  <!-- DC link: capacitor between the rails -->
  <g stroke="#496471" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M490 225H580M490 295H580M535 225v20M535 275v20M510 245h50M510 275h50"/>
  </g>
  <!-- inverter: three IGBT legs -->
  <g stroke="#496471" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 225v70M745 225v70M790 225v70"/>
    <path d="M692 245h16M692 275h16M737 245h16M737 275h16M782 245h16M782 275h16"/>
  </g>
  <!-- brake chopper and resistor -->
  <g stroke="#496471" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M535 320V470"/>
    <path d="M500 505h18l8-14l14 28l14-28l8 14h18"/>
  </g>
  <!-- belt: two pulleys and the belt -->
  <g fill="#e9f1f5" stroke="#7a96a4" stroke-width="4">
    <circle cx="680" cy="495" r="26"/>
    <circle cx="920" cy="495" r="26"/>
  </g>
  <g stroke="#496471" stroke-width="6" stroke-linecap="round"><path d="M680 469H920M680 521H920"/></g>
  <!-- motor symbol -->
  <g fill="#496471" font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="905" y="257" font-size="34">M</text>
    <text x="905" y="285" font-size="20">3~</text>
    <text x="115" y="188" font-size="20">SUPPLY</text>
    <text x="325" y="188" font-size="20">RECTIFIER</text>
    <text x="535" y="188" font-size="20">DC LINK</text>
    <text x="745" y="188" font-size="20">INVERTER</text>
    <text x="745" y="316" font-size="14">IGBT · PWM</text>
    <text x="905" y="188" font-size="20">MOTOR</text>
    <text x="535" y="462" font-size="15">BRAKE CHOPPER + RESISTOR</text>
    <text x="800" y="565" font-size="20">BELT</text>
  </g>
</svg>
